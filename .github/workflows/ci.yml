name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-rules:
    name: AI rules sinkron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check-ai

  selftest:
    name: Selftest script (hanya repo template)
    if: ${{ github.repository == 'Orlinkzz/ai-app-boilerplate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck scripts/*.sh scripts/hooks/pre-commit tests/*.sh
      - run: make selftest

  quality:
    name: Lint & Test
    if: ${{ github.repository != 'Orlinkzz/ai-app-boilerplate' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # STACK-SETUP:START
      # TODO: setup runtime + install dependency. Diisi otomatis oleh: make init STACK=<nama>
      # Contoh manual:
      # - uses: actions/setup-node@v4
      #   with: { node-version: lts/*, cache: npm }
      # - run: make deps
      # STACK-SETUP:END

      - run: make lint
      - run: make test
