name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy situs dokumentasi
    if: ${{ github.repository == 'Orlinkzz/ai-app-boilerplate' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify site directory
        run: |
          if [ ! -d "site" ]; then
            echo "::error::Folder site/ tidak ditemukan."
            exit 1
          fi

          if [ ! -f "site/index.html" ]; then
            echo "::error::File site/index.html tidak ditemukan."
            exit 1
          fi

          echo "Isi folder site/:"
          ls -la site/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
